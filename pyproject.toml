[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openbeats"
version = "0.1.0"
description = "Automatic beat markers for DaVinci Resolve 21.1+ Free and Studio"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "OpenBeats contributors" }]
keywords = ["davinci-resolve", "audio", "beat-detection", "markers", "librosa"]
dependencies = [
  "imageio-ffmpeg>=0.6,<0.7",
  "kivy>=2.3.1,<2.4",
  "librosa>=0.11,<1.1",
  "numpy>=2.1,<3",
  "platformdirs>=4.3,<5",
]

[project.urls]
Homepage = "https://github.com/ninocss/openbeats"
Repository = "https://github.com/ninocss/openbeats"
Issues = "https://github.com/ninocss/openbeats/issues"
Releases = "https://github.com/ninocss/openbeats/releases"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]
build = [
  "pyinstaller>=6.13,<7",
]

[project.scripts]
openbeats-agent = "openbeats.agent:main"

[tool.hatch.build.targets.wheel]
packages = ["app/openbeats"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
