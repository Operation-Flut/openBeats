[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openbeats"
version = "0.1.0"
description = "Automatic beat markers for DaVinci Resolve 21.1+ Free and Studio"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "OpenBeats contributors" }]
keywords = ["davinci-resolve", "audio", "beat-detection", "markers", "librosa"]
dependencies = [
  "librosa>=1.0,<1.1",
  "numpy>=2.1,<3",
  "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
openbeats-agent = "openbeats.agent:main"

[tool.hatch.build.targets.wheel]
packages = ["app/openbeats"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
