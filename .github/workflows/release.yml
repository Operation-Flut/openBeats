name: Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "release/v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate release version
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          if ($refName.StartsWith("release/")) {
            $tag = $refName.Substring("release/".Length)
          } else {
            $tag = $refName
          }

          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release refs must resolve to vMAJOR.MINOR.PATCH. Got: $refName"
          }
          $tagVersion = $Matches[1]

          $pyproject = Get-Content -LiteralPath "pyproject.toml" -Raw
          $match = [regex]::Match($pyproject, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $match.Success) {
            throw "Could not determine project version from pyproject.toml."
          }
          $projectVersion = $match.Groups[1].Value

          if ($projectVersion -ne $tagVersion) {
            throw "Release version $tagVersion does not match pyproject.toml version $projectVersion."
          }

          "OPENBEATS_VERSION=$tagVersion" >> $env:GITHUB_ENV
          "OPENBEATS_TAG=$tag" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build release installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Python python -Version $env:OPENBEATS_VERSION

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $installer = "installer/output/OpenBeatsSetup-$env:OPENBEATS_VERSION-x64.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Release installer not found: $installer"
          }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $name = Split-Path -Leaf $installer
          "$hash  $name" | Set-Content -LiteralPath "$installer.sha256" -Encoding ascii

      - name: Upload release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenBeats-v${{ env.OPENBEATS_VERSION }}-Windows
          path: |
            installer/output/OpenBeatsSetup-${{ env.OPENBEATS_VERSION }}-x64.exe
            installer/output/OpenBeatsSetup-${{ env.OPENBEATS_VERSION }}-x64.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "installer/output/OpenBeatsSetup-$env:OPENBEATS_VERSION-x64.exe"
          $checksum = "$installer.sha256"
          gh release create "$env:OPENBEATS_TAG" `
            $installer `
            $checksum `
            --target "${{ github.sha }}" `
            --title "OpenBeats $env:OPENBEATS_TAG" `
            --generate-notes
